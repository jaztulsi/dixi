<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Dixi Everywhere</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="marks" aria-hidden="true"></div>
  <div id="cursor" class="cursor" aria-hidden="true"></div>

  <!-- What screen readers hear: answers and progress politely; approval cards and Guardian stops at once.
       Kept outside the pill, so they exist (and stay live) while the pill is hidden. -->
  <p id="polite" class="sr" aria-live="polite"></p>
  <p id="assertive" class="sr" aria-live="assertive"></p>

  <section id="pill" class="glass" data-state="idle" aria-label="Dixi" hidden>
    <div class="backdrop" aria-hidden="true"></div>
    <div class="body">
      <header>
        <span id="buddy" class="buddy"></span>
        <div class="heading">
          <strong id="title">Dixi</strong>
          <small id="app"></small>
        </div>
        <button id="close" class="icon" aria-label="Stop">✕</button>
      </header>
      <p id="text"></p>
      <p id="hint" class="hint" hidden>Press ⌥Space again to stop</p>
      <ol id="steps"></ol>
      <ul id="hive"></ul>
      <div id="card" role="alertdialog" aria-labelledby="question" hidden>
        <p id="question"></p>
        <div class="choices">
          <button id="no" class="choice" aria-keyshortcuts="N Escape">No</button>
          <button id="yes" class="choice primary" aria-keyshortcuts="Y Enter">Yes</button>
        </div>
      </div>
    </div>
  </section>
  <script type="module" src="overlay.js"></script>
</body>
</html>
